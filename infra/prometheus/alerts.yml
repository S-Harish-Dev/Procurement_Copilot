# Alert rules. Visible in Prometheus (/alerts); route to Alertmanager in a real deployment.
groups:
  - name: procurement-copilot
    rules:
      - alert: GuardBlockSpike
        expr: sum(increase(guard_blocks_total[10m])) > 20
        labels: { severity: warning }
        annotations: { summary: "More than 20 guard blocks in 10 minutes (possible attack campaign)" }
      - alert: JevDegraded
        expr: max(jev_degraded) == 1
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Router/gate in degraded mode for more than 5 minutes" }
      - alert: ChatLatencySLO
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{route="/v1/chat"}[5m]))) > 8
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Chat p95 above 8 s for 10 minutes" }
      - alert: LlmErrorRate
        expr: sum(rate(llm_requests_total{result!="ok"}[5m])) / sum(rate(llm_requests_total[5m])) > 0.2
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "More than 20% of LLM calls failing" }
      - alert: DependencyDown
        expr: min by (dependency) (dependency_up) == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.dependency }} unreachable from the gateway" }
      - alert: ClassifierSkipped
        expr: sum(increase(classifier_skipped_total[5m])) > 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Injection classifier skipped requests (timeout/error): guard layer 4 degraded" }
