[project]
name = "brain"
version = "0.1.0"
description = "Procurement Copilot — Python side: agent, MCP servers, ingestion, synthetic data, evals"
# 3.15 is out but presidio (<3.15), onnxruntime and py-rust-stemmers have no 3.15 support yet.
requires-python = "==3.14.*"
# Direct dependencies are pinned exactly; uv.lock pins everything transitive.
dependencies = [
    # config / data
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "python-dotenv==1.2.4",
    "psycopg[binary,pool]==3.3.6",
    "cryptography==50.0.2",
    "faker==40.44.0",
    "httpx==0.28.1",
    "orjson==3.13.0",
    # index load + query-side embedding (light; runs on the laptop)
    "numpy==2.4.6",  # 2.5 blocked by presidio-analyzer's numpy<2.5 cap (ingest group shares one lock)
    "qdrant-client==1.20.0",
    "fastembed==0.9.1",
    "onnxruntime==1.31.1",
    "tokenizers==0.23.3",
    # agent + MCP + gRPC (M5)
    "pydantic-ai-slim[openai,mcp]==2.63.0",
    "mcp==2.3.0",
    "grpcio==1.85.0",
    "protobuf==7.36.2",
    "pyjwt[crypto]==2.15.1",
    "reportlab==5.1.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "ruff==0.17.3",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "grpcio-tools==1.85.0",
    "pytest-asyncio==1.4.1",
    "types-protobuf==7.35.1.20260906",
]
# HEAVY: only the build machine needs these (PDF parsing, NER-based PII masking, Prompt Guard 2 via torch).
# `uv run --group ingest ...` / `make build-index`. Laptops load data/index_bundle instead.
ingest = [
    "docling==2.145.0",
    "pypdf==6.21.4",
    "presidio-analyzer==2.2.366",
    "presidio-anonymizer==2.2.366",
    "spacy==3.8.18",
    "en-core-web-lg",
    # 2.14.1, not 2.15.0: torchvision has no release built for 2.15 yet.
    "torch==2.14.1",
    "torchvision==0.29.1",
    "onnx==1.23.2",  # int8 quantization / export of the guard classifier
]

[tool.uv]
package = false

[tool.uv.sources]
# CPU-only torch (docling's layout model). The default PyPI wheel drags in ~3 GB of CUDA libs.
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }  # must come from the same index as torch, or its C++ ops fail to load
# spaCy models are not on PyPI; pinned to the release wheel that matches spaCy 3.8.x.
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 110
target-version = "py314"
extend-exclude = ["agent/pb"]  # generated gRPC stubs

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Unicode is deliberate here: "›" joins section paths and attack samples use homoglyphs/fullwidth text.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Prose facts (eval gold answers) read better unbroken.
"synthetic/policy_specs.py" = ["E501"]
# SQL statements and user-facing messages read better unbroken.
"procurement/service.py" = ["E501"]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
exclude = ["agent/pb/"]

[[tool.mypy.overrides]]
module = ["agent.pb.*"]
ignore_errors = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
