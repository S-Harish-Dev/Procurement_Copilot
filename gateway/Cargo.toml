[workspace]
resolver = "3"
members = [
    "crates/telemetry",
    "crates/auth",
    "crates/policy",
    "crates/guard",
    "crates/retrieval",
    "crates/resilience",
    "crates/jev",
    "crates/classifier",
    "crates/cache",
    "crates/api",
    "crates/llm",
    "crates/mock-llm",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

# Exact pins (latest stable on 2026-10-30). Cargo.lock pins everything transitive.
[workspace.dependencies]
anyhow = "=1.0.104"
async-stream = "=0.3.6"
axum = { version = "=0.8.9", features = ["macros"] }
base64 = "=0.23.1"
# load-dynamic: libonnxruntime.so is loaded at runtime from ORT_DYLIB_PATH. The prebuilt static
# ONNX Runtime needs glibc >= 2.38; dynamic loading keeps the binary portable.
fastembed = { version = "=7.5.0", default-features = false, features = ["ort-load-dynamic", "hf-hub-rustls-tls"] }
bytes = "=1.12.1"
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
dashmap = "=6.2.1"
futures = "=0.3.34"
hmac = "=0.13.0"
http = "=1.5.0"
jsonwebtoken = { version = "=11.1.0", features = ["rust_crypto"] }
metrics = "=0.24.6"
metrics-exporter-prometheus = { version = "=0.18.3", default-features = false }
moka = { version = "=0.12.16", features = ["future"] }
# Same ort as fastembed (one ONNX Runtime per process; loaded dynamically from ORT_DYLIB_PATH).
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-24", "load-dynamic"] }
opentelemetry = "=0.33.1"
prost = "=0.14.4"
opentelemetry-otlp = { version = "=0.33.1", features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "=0.33.1", features = ["rt-tokio"] }
qdrant-client = { version = "=1.20.0", default-features = false }
rand = "=0.10.3"
redis = { version = "=1.8.1", features = ["tokio-comp", "connection-manager", "script"] }
regex = "=1.13.1"
rust-stemmers = "=1.2.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "json", "time", "derive"] }
thiserror = "=2.0.21"
time = { version = "=0.3.55", features = ["serde"] }
tokio = { version = "=1.54.1", features = ["full"] }
tokio-stream = "=0.1.19"
tokio-util = "=0.7.20"
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
toml = "=1.1.8"
tonic = { version = "=0.14.9", default-features = false, features = ["transport", "codegen"] }
tonic-prost = "=0.14.9"
tonic-prost-build = "=0.14.9"
tower = { version = "=0.5.3", features = ["limit", "timeout", "util"] }
tower-http = { version = "=0.7.1", features = ["cors", "trace", "request-id", "timeout"] }
tracing = "=0.1.44"
tracing-opentelemetry = "=0.34.0"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
unicode-normalization = "=0.1.26"
uuid = { version = "=1.29.0", features = ["v4", "v5", "serde"] }
wiremock = "=0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
