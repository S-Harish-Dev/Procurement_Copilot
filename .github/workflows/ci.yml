# CI: lint + unit tests (Python, Rust, OPA, web) on every push/PR. The same steps run locally with `make ci`;
# the retrieval evals need the index bundle and a running stack, so they are manual (`workflow_dispatch`).
name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  static-and-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.99.1", components: "clippy, rustfmt" }
      - name: Install OPA
        run: |
          curl -fsSL -o /usr/local/bin/opa https://github.com/open-policy-agent/opa/releases/download/v1.22.0/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
      - name: ONNX Runtime (gateway loads it dynamically)
        run: |
          curl -fsSL https://github.com/microsoft/onnxruntime/releases/download/v1.31.1/onnxruntime-linux-x64-1.31.1.tgz | tar -xz -C /opt
          echo "ORT_DYLIB_PATH=/opt/onnxruntime-linux-x64-1.31.1/lib/libonnxruntime.so.1.31.1" >> "$GITHUB_ENV"
      - run: make ci

  # Retrieval evals need the index bundle (built on a big machine, not in git): run on a self-hosted
  # runner that has it, or manually. Same command as locally.
  eval-fast:
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    needs: static-and-unit
    steps:
      - uses: actions/checkout@v4
      - run: make env keys up seed ingest
      - run: docker compose --env-file .env -f infra/docker-compose.yml --profile offline up -d gateway mock-llm mock-llm-2
      - run: make eval-fast
